<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — Souvik OS</title>
    <style>
      :root {
        --bg-app: #f5f4f2;
        --text-primary: #111010;
        --text-secondary: #5c5856;
        --accent-primary: #5b4cdc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-app: #0a0a0c;
          --text-primary: #f0eff4;
          --text-secondary: #8b8899;
          --accent-primary: #7c6ef0;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-app);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(128, 128, 128, 0.2);
        border-radius: 20px;
        padding: 40px 24px;
        max-width: 420px;
        width: 100%;
        backdrop-filter: blur(16px);
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(124, 110, 240, 0.15);
        color: var(--accent-primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; }
      p { font-size: 0.9375rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 24px; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-primary);
        color: #fff;
        font-weight: 600;
        font-size: 0.875rem;
        padding: 12px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Reconnect to the internet to sync and access your personal operating system.</p>
      <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
